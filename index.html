<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Олимпиадка · Русский язык</title>
<style>
/* ═══════════════════════════════════════════════════════════
   ЦВЕТОВАЯ СИСТЕМА — МЯТНЫЙ, ЗЕЛЁНЫЙ, СИНИЙ
═══════════════════════════════════════════════════════════ */
:root {
  --bg:       oklch(98% 0.005 170);
  --surface:  oklch(100% 0 0);
  --raised:   oklch(97% 0.008 170);
  --border:   oklch(90% 0.02  170);
  --text:     oklch(20% 0.02  170);
  --muted:    oklch(60% 0.015 170);

  --mint:     oklch(72% 0.15  170);
  --mint-dim: oklch(55% 0.12  170);
  --mint-bg:  oklch(95% 0.05  170);

  --green:    oklch(65% 0.18  140);
  --green-bg: oklch(93% 0.08  140);

  --blue:     oklch(60% 0.16  240);
  --blue-bg:  oklch(92% 0.06  240);

  --ok:       oklch(62% 0.16  148);
  --ok-bg:    oklch(93% 0.07  148);
  --err:      oklch(60% 0.19   25);
  --err-bg:   oklch(96% 0.06   25);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,"SF Pro Rounded","Segoe UI",sans-serif;
  background:linear-gradient(135deg, var(--bg) 0%, oklch(97% 0.01 220) 100%);
  min-height:100vh;
  display:flex;justify-content:center;
  padding:14px 12px 48px;
}
.app { width:100%; max-width:460px; }

/* ── ХЕДЕР ────────────────────────────────────────────────── */
.header {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
  box-shadow:0 2px 12px oklch(0% 0 0 / .06);
}
.header h1 { font-size:18px; font-weight:800; color:var(--text); }
.stats { display:flex; gap:9px; }
.stat {
  background:var(--mint-bg);
  border:1px solid oklch(72% 0.15 170 / .3);
  border-radius:11px;
  padding:6px 12px;
  font-size:13px;font-weight:700;
  color:var(--mint-dim);
}

/* ── ДНИ ──────────────────────────────────────────────────── */
.days { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:12px; }
.day-btn {
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px 2px;
  font-size:12.5px;font-weight:700;
  background:var(--surface);
  color:var(--text);cursor:pointer;
  transition:transform .12s,all .15s;
}
.day-btn:active { transform:scale(.9); }
.day-btn.done { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
.day-btn.active { border-color:var(--mint); background:var(--mint-bg); color:var(--mint-dim); }

/* ── ПРОГРЕСС ─────────────────────────────────────────────── */
.prog-wrap { height:3px; background:var(--border); border-radius:99px; margin-bottom:14px; overflow:hidden; }
.prog-fill {
  height:100%;
  background:linear-gradient(90deg, var(--mint) 0%, var(--green) 50%, var(--blue) 100%);
  border-radius:99px;
  transition:width .4s ease;
}

/* ── КАРТОЧКА ─────────────────────────────────────────────── */
.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px 18px;
  box-shadow:0 4px 16px oklch(0% 0 0 / .05);
  animation:appear .28s ease;
}
@keyframes appear { from{transform:translateY(6px) scale(.98);opacity:0}to{transform:none;opacity:1} }

.mascot { font-size:36px; text-align:center; margin-bottom:5px; }
.q-meta { text-align:center; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:10px; letter-spacing:.04em; text-transform:uppercase; }

/* ── СВИТОК (ПРАВИЛО) ─────────────────────────────────────── */
.scroll-box {
  background:var(--mint-bg);
  border:1px solid oklch(72% 0.15 170 / .2);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:14px;
  position:relative;
}
.scroll-box::before { content:'📜'; position:absolute; top:-10px; left:14px; font-size:18px; }
.scroll-title { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--mint-dim); margin-bottom:9px; padding-top:2px; }
.scroll-body {
  font-size:13.5px; line-height:1.65; color:var(--text);
  white-space:pre-line;
}
.scroll-body strong { color:var(--mint-dim); font-weight:700; }
.scroll-body em { color:var(--green); font-style:normal; font-weight:600; }

/* ── ВОПРОС ───────────────────────────────────────────────── */
.question {
  font-size:15.5px;font-weight:700;color:var(--text);
  margin-bottom:14px;line-height:1.5;
}

/* ── ВАРИАНТЫ ─────────────────────────────────────────────── */
.options { display:grid; gap:8px; }
.opt {
  border:1px solid var(--border);
  background:var(--raised);
  border-radius:13px;
  padding:12px 14px;
  font-size:14px;font-weight:600;
  color:var(--text);cursor:pointer;text-align:left;
  transition:transform .1s,border-color .15s,background .15s;
  line-height:1.4;
}
.opt:hover { border-color:var(--mint); background:var(--mint-bg); }
.opt:active { transform:scale(.98); }
.opt.sel { border-color:var(--mint); background:var(--mint-bg); }
.opt.correct { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
.opt.wrong { background:var(--err-bg); border-color:var(--err); color:var(--err); }

/* ── ВВОД ──────────────────────────────────────────────────── */
.txt-input {
  width:100%;
  background:var(--raised);
  border:1px solid var(--border);
  border-radius:13px;
  padding:13px 14px;
  font-size:15px;font-weight:600;
  color:var(--text);outline:none;
  transition:border-color .15s;
}
.txt-input:focus { border-color:var(--mint); }
.txt-input::placeholder { color:var(--muted); font-weight:400; }

/* ── ФИДБЕК ───────────────────────────────────────────────── */
.feedback { text-align:center; font-size:15px; font-weight:800; margin-top:11px; min-height:20px; }
.hint-ans { text-align:center; font-size:12.5px; color:var(--muted); margin-top:4px; }

/* ── МОТИВИРУЮЩАЯ ФРАЗА ───────────────────────────────────── */
.motivation {
  background:var(--blue-bg);
  border:1px solid var(--blue);
  border-left:3px solid var(--blue);
  border-radius:10px;
  padding:10px 12px;
  font-size:13px;color:var(--text);
  margin-top:10px;line-height:1.55;
  font-style:italic;
}
.motivation::before { content:'🎵 '; }

/* ── КНОПКИ ───────────────────────────────────────────────── */
.check-btn,.next-btn,.rule-btn {
  display:block;width:100%;
  margin-top:12px;
  border:none;border-radius:13px;
  padding:13px;
  font-size:15px;font-weight:800;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(135deg, var(--mint) 0%, var(--green) 100%);
  box-shadow:0 2px 8px oklch(0% 0 0 / .1);
  transition:transform .1s,box-shadow .15s;
}
.check-btn:active,.next-btn:active,.rule-btn:active { transform:scale(.98); box-shadow:none; }
.rule-btn { background:linear-gradient(135deg, var(--blue) 0%, oklch(60% 0.14 230) 100%); }

/* ── РЕЗУЛЬТАТ ────────────────────────────────────────────── */
.big { font-size:52px; text-align:center; margin:8px 0; }
.result-text { text-align:center; font-size:17px; font-weight:800; color:var(--text); }
.result-sub { text-align:center; font-size:13px; color:var(--muted); margin-top:6px; }
.stars-row { text-align:center; font-size:24px; margin:10px 0; }

/* ── ВСПЫШКИ ──────────────────────────────────────────────── */
@keyframes flashOk { 0%{box-shadow:0 0 0 0 oklch(62% 0.16 148 / .6)}70%{box-shadow:0 0 0 16px oklch(62% 0.16 148 / 0)}100%{box-shadow:none} }
.flash-ok { animation:flashOk .5s ease-out; }
@keyframes flashErr { 0%{box-shadow:0 0 0 0 oklch(60% 0.19 20 / .5)}70%{box-shadow:0 0 0 12px oklch(60% 0.19 20 / 0)}100%{box-shadow:none} }
.flash-err { animation:flashErr .4s ease-out; }

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>Олимпиадка 🎯</h1>
    <div class="stats">
      <div class="stat">⭐ <span id="stars">0</span></div>
      <div class="stat">🔥 <span id="streak">0</span></div>
    </div>
  </div>

  <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="days" id="days"></div>
  <div class="card" id="card"></div>

</div>

/* ═══════════════════════════════════════════════════════════

/* ═════════════════════════════════════════════════════════════

const DAYS = [

{title:"Приставки ПРИ-/ПРЕ-",

  {q:"завистн..ца", type:"mc", o:["Е","И"], a:1, fact:"завистница — ж.р. → И"},
  {q:"однофамил..ц", type:"mc", o:["Е","И"], a:0, fact:"однофамилец — м.р. → Е"},
  {q:"школьн..ца", type:"mc", o:["Е","И"], a:1, fact:"школьница — ж.р. → И"},
  {q:"любим..ца", type:"mc", o:["Е","И"], a:1, fact:"любимица — ж.р. → И"},
  {q:"дупл..цо", type:"mc", o:["Е","И"], a:0, fact:"дуплецо — ср.р., дупле́цо, ударение на окончании → Е"},
  {q:"кормил..ца", type:"mc", o:["Е","И"], a:1, fact:"кормилица — ж.р. → И"},
  {q:"спутн..ца", type:"mc", o:["Е","И"], a:1, fact:"спутница — ж.р. → И"},
  {q:"варень..це", type:"mc", o:["Е","И"], a:1, fact:"вареньице — ср.р., варе́ньице, ударение НА суффиксе → И"},
  {q:"масл..це", type:"mc", o:["Е","И"], a:1, fact:"маслице — ср.р., ма́слице, особый случай → И"},
  {q:"здоровь..це", type:"mc", o:["Е","И"], a:1, fact:"здоровьице — ср.р., здоро́вьице, ударение НА суффиксе → И"},
  {q:"кормил..ц", type:"mc", o:["Е","И"], a:0, fact:"кормилец — м.р. → Е"},
  {q:"избранн..ца", type:"mc", o:["Е","И"], a:1, fact:"избранница — ж.р. → И"},
  {q:"питом..ца", type:"mc", o:["Е","И"], a:1, fact:"питомица — ж.р. → И"},
  {q:"питом..ц", type:"mc", o:["Е","И"], a:0, fact:"питомец — м.р. → Е"},
  {q:"селень..це", type:"mc", o:["Е","И"], a:1, fact:"селеньице — ср.р., селе́ньице, ударение НА суффиксе → И"},
  {q:"ровесн..ца", type:"mc", o:["Е","И"], a:1, fact:"ровесница — ж.р. → И"},
]},
];

/* ═════════════════════════════════════════════════════════════
   ЛОГИКА
═════════════════════════════════════════════════════════════ */
let ST = JSON.parse(localStorage.getItem("olym")||'{"pts":0,"done":[],"streak":0,"lastDate":""}');
let curDay=0, curQ=0, correct=0;
const save = ()=>localStorage.setItem("olym",JSON.stringify(ST));

function updHdr(){
  document.getElementById("stars").textContent=ST.pts;
  document.getElementById("streak").textContent=ST.streak;
}

function renderDays(){
  const el=document.getElementById("days"); el.innerHTML="";
  DAYS.forEach((d,i)=>{
    const b=document.createElement("button");
    b.className="day-btn"+(ST.done.includes(i)?" done":"")+(i===curDay?" active":"");
    b.textContent=(ST.done.includes(i)?"✅ ":"")+(i+1);
    b.onclick=()=>{curDay=i;curQ=0;correct=0;renderDays();renderQ();};
    el.appendChild(b);
  });
}

function setProg(){
  const day=DAYS[curDay]; if(!day)return;
  document.getElementById("prog").style.width=Math.round((curQ/day.questions.length)*100)+"%";
}

function award(fb,ok,fact,card){
  if(ok){
    fb.textContent="✓ Верно!"; fb.style.color="var(--ok)";
    ST.pts++; correct++; save(); updHdr();
    card.classList.add("flash-ok"); setTimeout(()=>card.classList.remove("flash-ok"),600);
  } else {
    fb.textContent="Не беда, запомним!"; fb.style.color="var(--err)";
    card.classList.add("flash-err"); setTimeout(()=>card.classList.remove("flash-err"),500);
  }
  if(fact){
    const f=document.createElement("div");f.className="hint-ans";f.textContent=fact;
    fb.after(f);
  }
  const m=document.createElement("div");
  m.className="motivation";m.textContent=getQuote(ok);
  card.appendChild(m);
}

function addNext(card){
  const b=document.createElement("button");b.className="next-btn";b.textContent="Дальше →";
  b.onclick=()=>{curQ++;setProg();renderQ();};card.appendChild(b);
}

function renderQ(){
  setProg();
  const day=DAYS[curDay]; if(!day)return;
  if(curQ>=day.questions.length){renderResult();return;}
  const item=day.questions[curQ];
  const card=document.getElementById("card");

  if(item.stage==="rule"){
    card.innerHTML=`
      <div class="mascot">📖</div>
      <div class="q-meta">${day.title} · вопрос ${curQ+1}/${day.questions.length}</div>
      <div class="scroll-box">
        <div class="scroll-title">Правило</div>
        <div class="scroll-body">${item.q}</div>
      </div>`;
    const b=document.createElement("button");b.className="rule-btn";
    b.textContent="Понял! Вперёд →";
    b.onclick=()=>{curQ++;setProg();renderQ();};
    card.appendChild(b);
    return;
  }

  let html=`<div class="mascot">✍️</div>
    <div class="q-meta">${day.title} · ${curQ+1}/${day.questions.length}</div>
    <div class="question">${item.q}</div>`;

  html+=`<div class="options">${item.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>`;
  card.innerHTML=html;
  card.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const i=+btn.dataset.i;card.querySelectorAll(".opt").forEach(b=>b.onclick=null);
    const ok=i===item.a;
    if(ok)btn.classList.add("correct");
    else{btn.classList.add("wrong");card.querySelectorAll(".opt")[item.a].classList.add("correct");}
    award(document.getElementById("fb"),ok,item.fact||null,card);
    addNext(card);
  });
}

function renderResult(){
  const day=DAYS[curDay];
  const total=day.questions.filter(q=>q.stage!=="rule").length;
  if(!ST.done.includes(curDay)){
    ST.done.push(curDay);
    const today=new Date().toDateString();
    if(ST.lastDate!==today){
      const yest=new Date(Date.now()-864e5).toDateString();
      ST.streak=(ST.lastDate===yest)?ST.streak+1:1;ST.lastDate=today;
    }
    save();
  }
  updHdr();renderDays();
  document.getElementById("prog").style.width="100%";
  const pct=Math.round((correct/Math.max(total,1))*100);
  const emoji=pct===100?"🎉":pct>=70?"✨":"🌱";
  const msg=pct===100?"Идеально!":pct>=70?"Отлично!":"Практикуйся!";
  document.getElementById("card").innerHTML=`
    <div class="big">${emoji}</div>
    <div class="result-text">${msg}</div>
    <div class="result-sub">Правильно: ${correct} из ${total}</div>
    <div class="stars-row">${"⭐".repeat(Math.max(1,Math.min(correct,8)))}</div>
    <button class="next-btn" onclick="location.reload()">← Назад</button>`;
}

updHdr();renderDays();renderQ();
</script>
</body>
</html>
